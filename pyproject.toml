[project]
name = "healthrag"
version = "0.1.0"
description = "Safe RAG assistant over synthetic clinical records and public guidelines"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not llm and not network'"
markers = [
    "llm: needs an LLM endpoint",
    "network: needs network access",
]

[tool.ruff]
line-length = 120
target-version = "py311"
